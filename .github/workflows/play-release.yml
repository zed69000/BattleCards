# Envoie La Bataille Galactique sur Google Play (tests internes).
# La clé d'envoi du jeu n'existe que dans Codemagic : le workflow y lance le build « android-play » (AAB signé),
# récupère l'AAB, puis l'envoie sur Google Play avec le compte de service (PLAY_SERVICE_ACCOUNT_JSON).
# Se lance à la main : Actions > « Android · Google Play » > Run workflow (ou gh workflow run play-release.yml).
# Secrets du dépôt : CODEMAGIC_API_TOKEN et PLAY_SERVICE_ACCOUNT_JSON (cles.ps1 pousser -Repo BattleCards).
name: Android · Google Play

on:
  workflow_dispatch:

env:
  CM_APP: 6ad5b589f1c4cb8394680a40

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build signé sur Codemagic
        env:
          CM_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
        run: |
          id=$(curl -sf -H "x-auth-token: $CM_TOKEN" -H "Content-Type: application/json" \
            -d "{\"appId\":\"$CM_APP\",\"workflowId\":\"android-play\",\"branch\":\"${GITHUB_REF_NAME}\"}" \
            https://api.codemagic.io/builds | jq -r .buildId)
          test -n "$id" && test "$id" != null || { echo "Codemagic n'a pas lancé le build"; exit 1; }
          echo "Build Codemagic : https://codemagic.io/app/$CM_APP/build/$id"
          for i in $(seq 1 100); do
            sleep 30
            status=$(curl -sf -H "x-auth-token: $CM_TOKEN" https://api.codemagic.io/builds/$id | jq -r .build.status)
            echo "$status"
            case "$status" in finished) break ;; failed|canceled|timeout|skipped) exit 1 ;; esac
          done
          test "$status" = finished || { echo "Build trop long"; exit 1; }
          url=$(curl -sf -H "x-auth-token: $CM_TOKEN" https://api.codemagic.io/builds/$id | jq -r '.build.artefacts[] | select(.name | endswith(".aab")) | .url' | head -1)
          curl -sfL -H "x-auth-token: $CM_TOKEN" -o app-release.aab "$url"
          unzip -l app-release.aab | grep -q "base/manifest" && ls -l app-release.aab

      - name: Envoi sur Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.musclorduck.battlecards
          releaseFiles: app-release.aab
          track: internal
          status: completed
          # note de version des testeurs : un fichier par langue (whatsnew-fr-FR...)
          whatsNewDirectory: store/whatsnew
